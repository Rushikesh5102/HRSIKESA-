name: HṚṢĪKEŚA Sovereign CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Typecheck, Build & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Root Dependencies
        run: npm install

      - name: Install UI Dependencies
        run: npm --prefix ui install

      - name: Typecheck & Build Backend
        run: npm run build

      - name: Build Frontend UI & 3D Control Center
        run: npm --prefix ui run build

      - name: Execute Automated Test Suite
        run: npm test
